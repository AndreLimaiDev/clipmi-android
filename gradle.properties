org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Versi aplikasi (dinaikkan scripts/release.ps1; versionCode selalu naik untuk setiap APK rilis).
clipmi.versionName=0.1.1
clipmi.versionCode=3
# Repo GitHub publik khusus rilis APK Android ("pemilik/nama"), terpisah dari rilis desktop. Kosong = pembaruan dalam
# aplikasi mati. Tag rilis: v<versi>, misalnya v0.1.0, dengan satu file .apk dan SHA-256 di catatan rilis.
clipmi.updateRepo=AndreLimaiDev/clipmi-android-releases
